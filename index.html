        hd: ['Atkinson Hyperlegible', 'system-ui', 'sans-serif'],

<style>
:root{color-scheme:dark}
html{scroll-behavior:smooth}
body{background:#0A0A0A;color:#FFFFFF;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0}
.gutter{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
section[id]{scroll-margin-top:76px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
.btn{transition:background-color .15s ease,color .15s ease,transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.mq{display:flex;width:max-content;animation:mq 30s linear infinite}
.mq:hover{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
a:focus-visible,button:focus-visible{outline:3px solid #F5C230;outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  .mq{animation:none}
  .btn:hover{transform:none}
}
</style>

const SB_URL = 'https://esnopodsswwtsbavjwen.supabase.co';
const SB_KEY = 'sb_publishable_IA0R66sBAt21zEDL0Vw7dQ_ybJNJDhF';
const REF = (() => {
  try { return (new URLSearchParams(location.search).get('r') || 'direct').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40) || 'direct'; }
  catch (e) { return 'direct'; }
})();
const SESSION = (() => {
  try {
    let id = sessionStorage.getItem('wm_s');
    if (!id) { id = Math.random().toString(36).slice(2, 10); sessionStorage.setItem('wm_s', id); }
    return id;
  } catch (e) { return Math.random().toString(36).slice(2, 10); }
})();
const sent = {};
function track(type, detail) {
  const key = type + (detail || '');
  if (sent[key] || SB_URL.indexOf('__') === 0) return;
  sent[key] = true;
  try {
    fetch(SB_URL + '/rest/v1/visits', {
      method: 'POST',
      keepalive: true,
      headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, Prefer: 'return=minimal' },
      body: JSON.stringify({ ref: REF, session: SESSION, type: type, detail: detail || null, path: location.pathname, device: window.innerWidth < 768 ? 'mobile' : 'desktop' })
    }).catch(() => {});
  } catch (e) {}
}

function useTracking() {
  useEffect(() => {
    let human = false;
    const markHuman = () => { if (!human && document.visibilityState === 'visible') { human = true; track('view'); } };
    const timer = setTimeout(markHuman, 5000);
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      if (h <= 0) return;
      const p = window.scrollY / h;
      if (window.scrollY > 40) markHuman();
      if (p > 0.5) track('scroll', '50');
      if (p > 0.9) track('scroll', '90');
    };
    const onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href="https://calendar.app.google/YAN5EEpMBqcntsB66" target="_blank" rel="noopener"]');
      if (a) track('cta', (a.textContent || '').trim().slice(0, 30));
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    document.addEventListener('click', onClick);
    return () => { clearTimeout(timer); window.removeEventListener('scroll', onScroll); document.removeEventListener('click', onClick); };
  }, []);
}

/* ---------- helpers ---------- */

const reduced = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

function useInView(threshold) {
  const ref = useRef(null);
  const [on, setOn] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!('IntersectionObserver' in window) || reduced()) { setOn(true); return; }
    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) { setOn(true); io.disconnect(); }
    }, { threshold: threshold || 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, on];
}

function Reveal({ children, className = '', delay = 0 }) {
  const [ref, on] = useInView(0.12);
  return <div ref={ref} className={'rv ' + (on ? 'in ' : '') + className} style={{ transitionDelay: delay + 'ms' }}>{children}</div>;
}

function CountUp({ to, suffix = '', prefix = '' }) {
  const [ref, on] = useInView(0.4);
  const [n, setN] = useState(reduced() ? to : 0);
  useEffect(() => {
    if (!on || reduced()) { if (on) setN(to); return; }
    let raf; const t0 = performance.now(); const dur = 1400;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      setN(Math.round(to * (1 - Math.pow(1 - p, 3))));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [on]);
  return <span ref={ref}>{prefix}{n}{suffix}</span>;
}

function Label({ children, dark = false }) {
  return <p className={'font-mono text-[12px] uppercase tracking-[0.14em] ' + (dark ? 'text-black/60' : 'text-hi')}>{'{' + children + '}'}</p>;
}
