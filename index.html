<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { ink: '#0A0A0A', char: '#121212', line: '#27272A', hi: '#F5C230', mute: '#A1A1AA' },
      fontFamily: {
        hd: ['Anton', 'Impact', 'Arial Narrow', 'sans-serif'],
        body: ['Space Grotesk', 'system-ui', 'sans-serif'],
        mono: ['JetBrains Mono', 'ui-monospace', 'Consolas', 'monospace']
      }
    }
  }
};
</script>
<style>
:root{color-scheme:dark}
html{scroll-behavior:smooth}
body{background:#0A0A0A;color:#FFFFFF;font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dots{background-image:radial-gradient(#2E2E32 1px,transparent 1px);background-size:22px 22px}
.noscroll{scrollbar-width:none;-ms-overflow-style:none}
.noscroll::-webkit-scrollbar{display:none}
.plate{position:relative}
.plate::before,.plate::after{content:"";position:absolute;width:16px;height:16px;border:2px solid #F5C230;pointer-events:none}
.plate::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.plate::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.glow{transition:box-shadow .2s ease,transform .15s ease,background .15s ease,border-color .2s ease,color .2s ease}
.glow:hover{box-shadow:0 0 0 1px #F5C230,0 0 26px rgba(245,194,48,.4)}
a:focus-visible,button:focus-visible{outline:3px solid #F5C230;outline-offset:3px}
section[id]{scroll-margin-top:72px}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulseDot 1.6s ease-in-out infinite}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.glow{transition:none}}
</style>

</head>

const SB_KEY = 'sb_publishable_IA0R66sBAt21zEDL0Vw7dQ_ybJNJDhF';
const REF = (() => {
  try { return (new URLSearchParams(location.search).get('r') || 'direct').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40) || 'direct'; }
  catch (e) { return 'direct'; }
})();
const SESSION = (() => {
  try {
    let id = sessionStorage.getItem('wm_s');
    if (!id) { id = Math.random().toString(36).slice(2, 10); sessionStorage.setItem('wm_s', id); }
    return id;
  } catch (e) { return Math.random().toString(36).slice(2, 10); }
})();
const sent = {};
function track(type, detail) {
  const key = type + (detail || '');
  if (sent[key] || SB_URL.indexOf('__') === 0) return;
  sent[key] = true;
  try {
    fetch(SB_URL + '/rest/v1/visits', {
      method: 'POST',
      keepalive: true,
      headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, Prefer: 'return=minimal' },
      body: JSON.stringify({ ref: REF, session: SESSION, type: type, detail: detail || null, path: location.pathname, device: window.innerWidth < 768 ? 'mobile' : 'desktop' })
    }).catch(() => {});
  } catch (e) {}
}

function useTracking() {
  useEffect(() => {
    let human = false;
    const markHuman = () => { if (!human && document.visibilityState === 'visible') { human = true; track('view'); } };
    const timer = setTimeout(markHuman, 5000);
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      if (h <= 0) return;
      const p = window.scrollY / h;
      if (window.scrollY > 40) markHuman();
      if (p > 0.5) track('scroll', '50');
      if (p > 0.9) track('scroll', '90');
    };
    const onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href="#contact"]');
      if (a) track('cta', (a.textContent || '').trim().slice(0, 30));
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    document.addEventListener('click', onClick);
    return () => { clearTimeout(timer); window.removeEventListener('scroll', onScroll); document.removeEventListener('click', onClick); };
  }, []);
}
