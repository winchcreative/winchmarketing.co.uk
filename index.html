/* ---------- visit tracking (insert-only, no IPs, no cookies) ---------- */

const SB_URL = 'https://esnopodsswwtsbavjwen.supabase.co';
const SB_KEY = 'sb_publishable_IA0R66sBAt21zEDL0Vw7dQ_ybJNJDhF';
const REF = (() => {
  try { return (new URLSearchParams(location.search).get('r') || 'direct').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40) || 'direct'; }
  catch (e) { return 'direct'; }
})();
const SESSION = (() => {
  try {
    let id = sessionStorage.getItem('wm_s');
    if (!id) { id = Math.random().toString(36).slice(2, 10); sessionStorage.setItem('wm_s', id); }
    return id;
  } catch (e) { return Math.random().toString(36).slice(2, 10); }
})();
const sent = {};
function track(type, detail) {
  const key = type + (detail || '');
  if (sent[key] || SB_URL.indexOf('__') === 0) return;
  sent[key] = true;
  try {
    fetch(SB_URL + '/rest/v1/visits', {
      method: 'POST',
      keepalive: true,
      headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, Prefer: 'return=minimal' },
      body: JSON.stringify({ ref: REF, session: SESSION, type: type, detail: detail || null, path: location.pathname, device: window.innerWidth < 768 ? 'mobile' : 'desktop' })
    }).catch(() => {});
  } catch (e) {}
}

function useTracking() {
  useEffect(() => {
    let human = false;
    const markHuman = () => { if (!human && document.visibilityState === 'visible') { human = true; track('view'); } };
    const timer = setTimeout(markHuman, 5000);
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      if (h <= 0) return;
      const p = window.scrollY / h;
      if (window.scrollY > 40) markHuman();
      if (p > 0.5) track('scroll', '50');
      if (p > 0.9) track('scroll', '90');
    };
    const onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href^="https://calendar.app.google"]');
      if (a) track('cta', (a.textContent || '').trim().slice(0, 30));
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    document.addEventListener('click', onClick);
    return () => { clearTimeout(timer); window.removeEventListener('scroll', onScroll); document.removeEventListener('click', onClick); };
  }, []);
}

/* ---------- helpers ---------- */

const reduced = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

function useInView(threshold) {
  const ref = useRef(null);
  const [on, setOn] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!('IntersectionObserver' in window) || reduced()) { setOn(true); return; }
    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) { setOn(true); io.disconnect(); }
    }, { threshold: threshold || 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, on];
}

function Reveal({ children, className = '', delay = 0 }) {
  const [ref, on] = useInView(0.12);
  return <div ref={ref} className={'rv ' + (on ? 'in ' : '') + className} style={{ transitionDelay: delay + 'ms' }}>{children}</div>;
}

function CountUp({ to, suffix = '', prefix = '' }) {
  const [ref, on] = useInView(0.4);
  const [n, setN] = useState(reduced() ? to : 0);
  useEffect(() => {
    if (!on || reduced()) { if (on) setN(to); return; }
    let raf; const t0 = performance.now(); const dur = 1400;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      setN(Math.round(to * (1 - Math.pow(1 - p, 3))));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [on]);
  return <span ref={ref}>{prefix}{n}{suffix}</span>;
}

function Bars({ title, before, after, max, unit = '', afterLabel }) {
  const [ref, on] = useInView(0.4);
  const h = (v) => (on ? Math.round((v / max) * 100) : 4) + '%';
  const tr = reduced() ? 'none' : 'height 1.1s cubic-bezier(.2,.8,.2,1)';
  return (
    <div ref={ref}>
      <p className="mb-4 font-mono text-[11px] uppercase tracking-[0.14em] text-white/55">{title}</p>
      <div className="flex h-40 items-end gap-4 md:h-48">
        <div className="flex h-full w-1/2 flex-col justify-end gap-2">
          <div className="bg-white/20" style={{ height: h(before), transition: tr }}></div>
        </div>
        <div className="flex h-full w-1/2 flex-col justify-end gap-2">
          <div className="bg-hi" style={{ height: h(after), transition: tr }}></div>
        </div>
      </div>
      <div className="mt-3 flex gap-4 font-mono text-[12px] uppercase tracking-[0.1em]">
        <span className="w-1/2 text-white/55">Before<br /><b className="text-[15px] text-white">{before}{unit}</b></span>
        <span className="w-1/2 text-white/55">Now<br /><b className="text-[15px] text-hi">{afterLabel || after}{unit}</b></span>
      </div>
    </div>
  );
}

function Contact() {
  const [copied, setCopied] = useState(false);
  const email = 'hello@winchmarketing.co.uk';
  const copy = () => {
    track('copy_email');
    try {
      navigator.clipboard.writeText(email).then(
        () => { setCopied(true); setTimeout(() => setCopied(false), 1800); },
        () => setCopied(false)
      );
    } catch (e) { setCopied(false); }
  };
  return (
    <section id="contact" className="bg-hi text-black">
      <div className="gutter mx-auto flex max-w-[1280px] flex-col gap-10 py-16 md:flex-row md:items-end md:justify-between md:py-24">

        </Reveal>
      </div>
    </section>
  );
}
