{
  "@context": "https://schema.org",

  "mainEntity": [
    {
      "@type": "Question",
      "@id": "https://winchmarketing.co.uk/marketing-for-window-companies/#who-its-for",
      "name": "Who is this for?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Owner-run window and door companies, usually 5 to 25 people, who sell through a home survey or a showroom visit. Jobs worth a few thousand pounds, where the customer thinks it over before saying yes. If you're a national brand with a marketing department, I'm not your man. If you're the person who signs off the van livery and answers the phone on a Saturday, I probably am."
      }
    },
    {
      "@type": "Question",
      "@id": "https://winchmarketing.co.uk/marketing-for-window-companies/#why-windows-are-different",
      "name": "Why is marketing windows different?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nobody buys windows on a whim. It's a big, rare purchase, most people get three quotes, and the decision gets made at the kitchen table after your surveyor has driven off. So the moments that matter most are the ones around the survey: what someone sees before they book it, and what they're left holding afterwards. For most firms, the last thing a customer sees is a PDF with a price on it. That's the bit I like to fix first."
      }
    },
    {
      "@type": "Question",
      "@id": "https://winchmarketing.co.uk/marketing-for-window-companies/#what-i-can-build",
      "name": "What can you actually build for my company?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "<ul><li><strong>A quote people want to read.</strong> A digital flip-through quote with photos of your work, your team, the spec, the guarantees and a way to sign online. I built one for a flooring company and it's in use now. There's a demo you can try.</li><li><strong>Finance shown as a monthly figure.</strong> If you offer finance, a simple calculator so people see a monthly cost, not just a big number. I built one for a pay-weekly flooring company.</li><li><strong>Pages for the towns you cover.</strong> Real pages with jobs from that town, not ten copies of the same text with the name swapped.</li><li><strong>Reviews that keep coming.</strong> A simple ask after every fit, so your Google rating reflects the work you actually do.</li><li><strong>Ads that look like you.</strong> Facebook and Instagram ads featuring you or your fitters, because people buy from people they recognise.</li><li><strong>Tracking that tells the truth.</strong> So you know which ads bring surveys, not just clicks.</li></ul>"
      }
    },
    {
      "@type": "Question",
      "@id": "https://winchmarketing.co.uk/marketing-for-window-companies/#cost",
      "name": "How much does it cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Every job gets a fixed price before I start, so there are no surprises. Ongoing help is billed by the hour against a weekly budget you set. No contracts thicker than a sandwich."
      }
    },
    {
      "@type": "Question",
      "@id": "https://winchmarketing.co.uk/marketing-for-window-companies/#where-i-work",
      "name": "Do you only work in North Yorkshire?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "I'm based in Northallerton and happy to visit firms across North Yorkshire, Teesside and County Durham. Most of the work is done remotely, so if you're further away we can still work together."
      }
    },
    {
      "@type": "Question",
      "@id": "https://winchmarketing.co.uk/marketing-for-window-companies/#first-15-minutes",
      "name": "What happens in the first 15 minutes?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We look at your website and one of your quotes together, and I tell you the one thing I'd change first. If it's useful, great. If not, you've lost about 4 times listening to the Macarena."

          <h1 className="font-hd text-[clamp(40px,8.4vw,104px)] font-bold uppercase leading-[0.95] tracking-[-0.01em]">
            Marketing for{' '}<br /><span className="text-hi">window and door companies</span>
          </h1>
        </Reveal>
        <Reveal delay={120}>
          <p className="mt-10 max-w-[860px] rounded-[4px] bg-hi p-6 text-[19px] leading-relaxed text-black md:p-10 md:text-[22px]">
            I help owner-run window and door companies turn more surveys into signed orders. That usually means a quote people actually want to read, a website that shows the jobs you're proud of, ads with your own face in them, and a steady flow of Google reviews. I'm Alex. I've worked in marketing for 15 years and I couldn't fit a window if you paid me. You can. That's the deal.
          </p>
        </Reveal>
        <Reveal delay={200}>
          <nav aria-label="On this page" className="mt-10">
            <ul className="m-0 flex list-none flex-col p-0 font-mono text-[12px] uppercase tracking-[0.12em] md:flex-row md:flex-wrap md:items-center md:gap-x-3">
              {JUMPS.map(([id, t], i) => (
                <li key={id} className="flex items-center gap-3">
                  {i > 0 && <span aria-hidden="true" className="hidden text-dim md:inline">·</span>}
                  <a href={'#' + id} className="inline-flex min-h-[44px] items-center text-mute underline decoration-white/30 underline-offset-4 hover:text-hi">{t}</a>
                </li>
              ))}
            </ul>
          </nav>
        </Reveal>
      </div>
    </section>
  );
}

function Answers() {
  return (
    <section className="bg-paper text-black">
      <div className="gutter mx-auto max-w-[1280px] py-16 md:py-24">
        {QA.map((x, i) => (
          <Reveal key={x.id} className={'grid gap-4 border-black/15 py-10 md:grid-cols-[80px_1fr_1.25fr] md:gap-8 md:py-14' + (i ? ' border-t' : '')}>
            <span className="font-mono text-[12px] tracking-[0.12em] text-black/50">{'(0' + (i + 1) + ')'}</span>
            <h2 id={x.id} className="scroll-mt-28 font-hd text-[clamp(26px,3.6vw,44px)] font-bold uppercase leading-[1.05]">{x.q}</h2>
            <div
              className="text-[18px] leading-relaxed text-black/75 [&_li]:mt-5 [&_li]:border-l-[3px] [&_li]:border-hi [&_li]:pl-4 [&_li:first-child]:mt-0 [&_strong]:font-bold [&_strong]:text-black [&_ul]:m-0 [&_ul]:list-none [&_ul]:p-0"
              dangerouslySetInnerHTML={{ __html: x.a.charAt(0) === '<' ? x.a : '<p>' + escHtml(x.a) + '</p>' }}
            />
          </Reveal>
        ))}
      </div>
    </section>
  );
}

function App() {
  useTracking();
  return (
    <div id="top" className="pb-[calc(56px+env(safe-area-inset-bottom,0px))] md:pb-0">
      <Banner />
      <Header home={false} />
      <main>
        <Intro />
        <Answers />
        <Contact />
      </main>
      <Footer />
      <StickyBar />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
if (window.__ldDone) window.__ldDone();
</script>
